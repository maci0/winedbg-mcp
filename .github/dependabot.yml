version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

# The lockfile's packages are Renovate's job, not Dependabot's: this repository
# writes bun.lock at lockfileVersion 2, which the bun ecosystem in
# dependabot-core cannot parse, so that entry failed every weekly run
# ("Unsupported bun.lock 'lockfileVersion' 2"). Renovate's npm manager reads
# bun.lock, and renovate.json carries the groupings this entry used to hold.
# CI installs with --frozen-lockfile, so nothing in the tree moves unless a
# pull request says so, and without either bot the ~100 packages
# @modelcontextprotocol/sdk pulls in stay frozen at whatever they resolved to
# on the day the lockfile was written.
