name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # README names Linux and macOS as the supported platforms, and the artifact
    # is a bin a client launches under either host, so both get the whole gate
    # and not just the one the author happens to use.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # `bun run lint` calls shellcheck directly. The Ubuntu runner image ships
      # it, the macOS image does not, so the same gate passed on one leg of the
      # matrix and died with exit 127 on the other. Provide it where it is
      # missing rather than dropping the check or narrowing the matrix.
      - name: Install shellcheck
        run: |
          if command -v shellcheck >/dev/null; then
            exit 0
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
      - run: bun run check
      - run: bun run build
      - run: scripts/verify-artifact.sh
